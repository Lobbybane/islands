<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b2a4a">
<title>Floating Island</title>
<style>
  :root{
    --glass: rgba(14, 22, 40, .34);
    --glass-strong: rgba(14, 22, 40, .52);
    --line: rgba(255,255,255,.16);
    --line-strong: rgba(255,255,255,.28);
    --txt: #ffffff;
    --muted: rgba(255,255,255,.72);
    --faint: rgba(255,255,255,.5);
    --gold: #ffd58a;
    --peach: #ffad7a;
    --teal: #8ff3e6;
    --font: "Avenir Next", "Avenir", "Nunito", "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#0d1426;color:var(--txt);font-family:var(--font);
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;user-select:none;-webkit-user-select:none;touch-action:none}
  #app{position:fixed;inset:0}
  #app canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
  #app canvas:active{cursor:grabbing}

  /* cinematic framing */
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(130% 95% at 50% 46%, transparent 58%, rgba(4,8,22,.42) 100%),
      linear-gradient(180deg, rgba(4,10,28,.28) 0%, transparent 22%, transparent 72%, rgba(4,10,28,.38) 100%);}
  .corner-glow{position:fixed;left:0;top:0;width:min(720px,85vw);height:400px;pointer-events:none;
    background:radial-gradient(70% 80% at 0% 0%, rgba(6,14,36,.5), rgba(6,14,36,.18) 50%, transparent 72%)}

  /* ---------- title card ---------- */
  .titlecard{position:fixed;top:clamp(18px,3.4vw,42px);left:clamp(18px,3.4vw,46px);pointer-events:none;
    opacity:0;transform:translateY(-8px);transition:opacity 1.2s ease .35s, transform 1.2s cubic-bezier(.2,.8,.2,1) .35s}
  body.ready .titlecard{opacity:1;transform:none}
  .eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:600;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}
  .eyebrow::before{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,currentColor)}
  .title{margin-top:12px;line-height:.86;filter:drop-shadow(0 6px 22px rgba(0,18,52,.38))}
  .title .t1{display:block;font-size:clamp(15px,1.9vw,22px);font-weight:500;letter-spacing:.62em;text-transform:uppercase;
    color:rgba(255,255,255,.92);margin-left:.08em}
  .title .t2{display:block;font-size:clamp(52px,7.6vw,98px);font-weight:800;letter-spacing:-.02em;margin-top:.06em;
    background:linear-gradient(176deg,#ffffff 18%,#fff1d2 56%,#ffc690 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .tagline{margin-top:12px;font-size:13.5px;color:rgba(255,255,255,.9);letter-spacing:.02em;max-width:300px;line-height:1.45;
    text-shadow:0 1px 2px rgba(0,10,30,.45),0 2px 14px rgba(0,10,30,.55)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px 0 9px;border-radius:999px;
    background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
    font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#fff;box-shadow:0 6px 18px rgba(0,10,30,.16)}
  .chip svg{width:16px;height:16px;opacity:.95}
  .chip .v{transition:opacity .3s}

  /* ---------- top right ---------- */
  .topright{position:fixed;top:clamp(18px,3.4vw,42px);right:clamp(18px,3.4vw,46px);display:flex;gap:10px;
    opacity:0;transition:opacity 1.2s ease .6s}
  body.ready .topright{opacity:1}
  .iconbtn{appearance:none;border:1px solid var(--line);background:var(--glass);color:#fff;width:44px;height:44px;border-radius:14px;
    display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(12px) saturate(140%);-webkit-backdrop-filter:blur(12px) saturate(140%);
    transition:background .2s, transform .15s, border-color .2s}
  .iconbtn:hover{background:var(--glass-strong);border-color:var(--line-strong);transform:translateY(-1px)}
  .iconbtn svg{width:20px;height:20px}
  .iconbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ---------- bottom bar ---------- */
  .dock{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,16px);
    display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;
    transition:opacity 1s ease .55s, transform 1s cubic-bezier(.2,.8,.2,1) .55s}
  body.ready .dock{opacity:1;transform:translate(-50%,0)}
  .hint{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-shadow:0 1px 8px rgba(0,10,30,.6);
    display:flex;gap:14px;align-items:center}
  .hint i{width:3px;height:3px;border-radius:50%;background:currentColor;display:inline-block}
  .bar{display:flex;gap:6px;padding:7px;border-radius:24px;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
    box-shadow:0 24px 60px rgba(0,8,28,.34), inset 0 1px 0 rgba(255,255,255,.12)}
  .btn{appearance:none;border:0;font:inherit;color:#fff;cursor:pointer;position:relative;overflow:hidden;
    display:flex;align-items:center;gap:12px;min-width:168px;padding:9px 12px 9px 9px;border-radius:17px;
    background:rgba(255,255,255,.05);transition:background .25s, transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .25s}
  .btn:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
  .btn.pressed{transform:scale(.955)}
  .btn .ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(255,255,255,.04));box-shadow:inset 0 1px 0 rgba(255,255,255,.2);
    transition:background .3s}
  .btn .ico svg{width:22px;height:22px;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
  .btn:hover .ico svg{transform:rotate(-8deg) scale(1.06)}
  .btn .lbl{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;text-align:left}
  .btn .lbl b{font-size:14px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
  .btn .lbl small{font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
  .btn kbd{margin-left:auto;font:700 11px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:5px 7px 4px;border-radius:7px;
    color:rgba(255,255,255,.88);background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.22);border-bottom-width:2.5px}
  .btn.active{background:linear-gradient(160deg,rgba(255,213,138,.34),rgba(255,173,122,.16));box-shadow:inset 0 0 0 1px rgba(255,213,138,.55)}
  .btn.active .ico{background:linear-gradient(160deg,rgba(255,226,170,.6),rgba(255,173,122,.2))}
  .btn .ripple{position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .6s ease-out forwards}
  @keyframes rip{to{transform:scale(1);opacity:0}}

  /* ---------- explode labels ---------- */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lb{position:absolute;left:0;top:0;display:flex;align-items:center;will-change:transform,opacity;opacity:0}
  .lb .dot{width:10px;height:10px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.22),0 0 16px rgba(255,255,255,.7);margin-left:-5px}
  .lb .ln{width:var(--ln,64px);height:1px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.35))}
  .lb .card{display:flex;align-items:center;gap:10px;padding:7px 13px 7px 8px;border-radius:12px;background:var(--glass-strong);
    border:1px solid var(--line-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
  .lb .num{font:700 10.5px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#1a2440;background:var(--gold);border-radius:6px;padding:4px 5px}
  .lb b{display:block;font-size:13px;font-weight:700;letter-spacing:.02em}
  .lb span.d{display:block;font-size:11px;color:var(--muted);margin-top:1px}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;top:clamp(18px,3.4vw,42px);transform:translate(-50%,-14px);opacity:0;pointer-events:none;
    padding:10px 18px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:600;letter-spacing:.03em;
    transition:opacity .35s ease, transform .45s cubic-bezier(.2,.8,.2,1);white-space:nowrap;display:flex;align-items:center;gap:8px}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #toast svg{width:16px;height:16px}

  .version{position:fixed;left:clamp(18px,3.4vw,46px);bottom:max(22px,env(safe-area-inset-bottom));font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--faint);pointer-events:none;opacity:0;transition:opacity 1s ease 1s}
  body.ready .version{opacity:1}

  /* ---------- loader ---------- */
  #loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 40%,#2c4a7c,#0d1426 70%);
    z-index:10;transition:opacity 1.1s ease, visibility 1.1s}
  body.ready #loader{opacity:0;visibility:hidden}
  #loader .in{display:flex;flex-direction:column;align-items:center;gap:18px}
  #loader .lt{font-size:13px;letter-spacing:.6em;text-transform:uppercase;font-weight:600;color:rgba(255,255,255,.85);margin-left:.6em}
  #loader .isle{width:58px;height:58px;animation:bob 2.2s ease-in-out infinite}
  #loader .bar2{width:160px;height:2px;border-radius:2px;background:rgba(255,255,255,.14);overflow:hidden}
  #loader .bar2 i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--gold),var(--peach));animation:load 1.1s ease-in-out infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
  @keyframes bob{50%{transform:translateY(-6px)}}

  @media (max-width: 860px){
    .btn{min-width:0;flex:1;flex-direction:column;gap:6px;padding:9px 6px 8px}
    .btn .lbl{align-items:center}
    .btn .lbl small,.btn kbd{display:none}
    .btn .lbl b{font-size:12px}
    .bar{width:calc(100vw - 24px);max-width:520px}
    .dock{width:calc(100vw - 24px)}
    .hint{font-size:10px;letter-spacing:.12em}
    .version{display:none}
    .tagline{display:none}
  }
  @media (max-width: 520px){
    .chips{gap:6px;margin-top:12px}
    .chip{height:27px;font-size:11.5px;padding:0 10px 0 8px}
    .lb .card{padding:5px 9px 5px 6px}
    .lb span.d{display:none}
  }
  @media (pointer: coarse){ .btn kbd{display:none} }
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.170.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.170.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app"></div>
<div class="corner-glow"></div>
<div class="vignette"></div>

<header class="titlecard">
  <div class="eyebrow">A tiny world adrift</div>
  <h1 class="title"><span class="t1">Floating</span><span class="t2">Island</span></h1>
  <p class="tagline">Tend a little island above the clouds. Change the sky, plant a forest, and peek at what holds it all together.</p>
  <div class="chips">
    <span class="chip" id="chipTime"></span>
    <span class="chip" id="chipWeather"></span>
    <span class="chip" id="chipTrees"></span>
  </div>
</header>

<div class="topright">
  <button class="iconbtn" id="soundBtn" aria-label="Toggle sound (M)" title="Sound (M)"></button>
</div>

<div class="dock">
  <div class="hint"><span>Drag to orbit</span><i></i><span>Scroll to zoom</span></div>
  <nav class="bar" aria-label="Island controls">
    <button class="btn" data-action="daynight" aria-label="Toggle day and night (D)">
      <span class="ico" id="icoDN"></span>
      <span class="lbl"><b>Day / Night</b><small id="subDN">Morning sun</small></span>
      <kbd>D</kbd>
    </button>
    <button class="btn" data-action="weather" aria-label="Cycle weather (W)">
      <span class="ico" id="icoW"></span>
      <span class="lbl"><b>Weather</b><small id="subW">Clear skies</small></span>
      <kbd>W</kbd>
    </button>
    <button class="btn" data-action="grow" aria-label="Grow a tree (G)">
      <span class="ico" id="icoG"></span>
      <span class="lbl"><b>Grow</b><small id="subG">Plant a tree</small></span>
      <kbd>G</kbd>
    </button>
    <button class="btn" data-action="explode" aria-label="Explode island into layers (E)">
      <span class="ico" id="icoE"></span>
      <span class="lbl"><b>Explode</b><small id="subE">See the layers</small></span>
      <kbd>E</kbd>
    </button>
  </nav>
</div>

<div class="version">v1.0 · Skyward Edition</div>
<div id="labels"></div>
<div id="toast"></div>

<div id="loader">
  <div class="in">
    <svg class="isle" viewBox="0 0 64 64" fill="none">
      <path d="M8 26h48l-6 8-8 4-6 14-4-10-8-4-8-4z" fill="#8a7a6c"/>
      <path d="M8 26c6-4 14-5 24-5s18 1 24 5H8z" fill="#7ccf55"/>
      <path d="M28 21V11l8 4-8 4" stroke="#ffd58a" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <div class="lt">Floating Island</div>
    <div class="bar2"><i></i></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* =====================================================================
   Icons (inline SVG, drawn in code)
   ===================================================================== */
const svg = (d, extra = '') => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  sun: svg('<circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2.1M12 19.3v2.1M4.7 4.7l1.5 1.5M17.8 17.8l1.5 1.5M2.6 12h2.1M19.3 12h2.1M4.7 19.3l1.5-1.5M17.8 6.2l1.5-1.5"/>'),
  moon: svg('<path d="M20 14.6A8.2 8.2 0 1 1 9.4 4a6.6 6.6 0 0 0 10.6 10.6z"/><path d="M16.5 3.5v2.2M15.4 4.6h2.2" stroke-width="1.5"/>'),
  clear: svg('<circle cx="8.6" cy="8.6" r="3.1"/><path d="M8.6 2.6v1.3M3.9 4l.9.9M2.6 8.6h1.3M13.3 4l-.9.9"/><path d="M8.8 19.5h8.6a3.6 3.6 0 0 0 .4-7.15 5 5 0 0 0-9.4.75 3.2 3.2 0 0 0 .4 6.4z"/>'),
  rain: svg('<path d="M7.2 14.5h9.9a3.6 3.6 0 0 0 .5-7.16A5.1 5.1 0 0 0 7.9 6.5a4 4 0 0 0-.7 8z"/><path d="M8.5 17.5l-1 2.8M12.5 17.5l-1 2.8M16.5 17.5l-1 2.8"/>'),
  snow: svg('<path d="M12 2.8v18.4M4 7.4l16 9.2M4 16.6l16-9.2"/><path d="M9.6 4.4 12 6.6l2.4-2.2M9.6 19.6 12 17.4l2.4 2.2M4.5 10.6l3.1-1-0.7-3.1M19.5 13.4l-3.1 1 .7 3.1M6.9 17.5l.7-3.1-3.1-1M17.1 6.5l-.7 3.1 3.1 1" stroke-width="1.5"/>'),
  sprout: svg('<path d="M12 21v-8.5"/><path d="M12 12.8c0-4.3 2.6-6.9 7.3-6.9 0 4.3-2.6 6.9-7.3 6.9z"/><path d="M12 15c0-3.4-2.1-5.5-6.2-5.5 0 3.4 2.1 5.5 6.2 5.5z"/><path d="M7.5 21h9"/>'),
  layers: svg('<path d="M12 3 3 7.6l9 4.6 9-4.6z"/><path d="M3 12l9 4.6 9-4.6"/><path d="M3 16.4 12 21l9-4.6"/>'),
  merge: svg('<path d="M12 7.5 3 12l9 4.5 9-4.5z"/><path d="M12 2.5v3.2M10 4.2l2 1.8 2-1.8M12 21.5v-3.2M10 19.8l2-1.8 2 1.8"/>'),
  tree: svg('<path d="M12 2.8 6.6 11h2.9l-4 6.2h13l-4-6.2h2.9z"/><path d="M12 17.2v4"/>'),
  soundOn: svg('<path d="M4 9.4h3.4L12 5.4v13.2l-4.6-4H4z"/><path d="M15.6 9a4.2 4.2 0 0 1 0 6M18.3 6.4a8 8 0 0 1 0 11.2"/>'),
  soundOff: svg('<path d="M4 9.4h3.4L12 5.4v13.2l-4.6-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/>'),
};

/* =====================================================================
   Small utilities
   ===================================================================== */
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rand = mulberry32(20241117);
const rr = (a, b) => a + (b - a) * rand();
const pick = arr => arr[Math.floor(rand() * arr.length)];
function hash3(x, y, z) { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); }
function distToSeg(px, pz, ax, az, bx, bz) {
  const dx = bx - ax, dz = bz - az; const t = clamp(((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz), 0, 1);
  return Math.hypot(px - (ax + dx * t), pz - (az + dz * t));
}
class Tween {
  constructor(v) { this.v = v; this.from = v; this.to = v; this.t0 = 0; this.dur = 1; }
  set(to, dur, now) { this.from = this.v; this.to = to; this.t0 = now; this.dur = Math.max(1e-3, dur); }
  update(now, ease = easeInOut) { const p = clamp((now - this.t0) / this.dur, 0, 1); this.v = lerp(this.from, this.to, ease(p)); return this.v; }
  get active() { return this.v !== this.to; }
}
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const C = hex => new THREE.Color(hex);

/* jitter a geometry's vertices deterministically by position → no cracks on shared seams */
function jitterGeo(geo, amt, seed = 0) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    p.setXYZ(i,
      x + (hash3(x + seed, y, z + 1.3) - .5) * amt,
      y + (hash3(x + 2.1, y + seed, z) - .5) * amt,
      z + (hash3(x, y + 4.2, z + seed * 1.7) - .5) * amt);
  }
  geo.computeVertexNormals();
  return geo;
}

/* =====================================================================
   Renderer / scene / camera
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('app').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xffe2c2, 45, 170);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 1500);
const PHI_C = 0.86;                                   // initial camera azimuth
camera.position.set(Math.cos(PHI_C) * 33, 6.5, Math.sin(PHI_C) * 33);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -3.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.minDistance = 14;
controls.maxDistance = 70;
controls.maxPolarAngle = Math.PI * 0.86;
controls.autoRotateSpeed = 0.0;
controls.autoRotate = true;
controls.update();

// shared uniform: pixel scale for size-attenuated points
const pointScale = { value: 1 };
const pixelRatioU = { value: renderer.getPixelRatio() };
function updatePointScale() {
  pointScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  pixelRatioU.value = renderer.getPixelRatio();
}
updatePointScale();

/* =====================================================================
   Sky dome, stars
   ===================================================================== */
const forward0 = V3(-Math.cos(PHI_C), 0, -Math.sin(PHI_C));
const right0 = V3(Math.sin(PHI_C), 0, -Math.cos(PHI_C));

const matCache = new Map();
function mat(color, opts = {}) {

    const m = new THREE.MeshStandardMaterial({ color, flatShading: true, roughness: 0.92, metalness: 0, ...opts });

function inst(geo, material, items, cast = true, receive = true) {

  items.forEach((it, i) => {

    const s = it.s ?? 1; typeof s === 'number' ? _o.scale.setScalar(s) : _o.scale.set(...s);
    _o.updateMatrix(); im.setMatrixAt(i, _o.matrix);
    if (it.c) im.setColorAt(i, _c.set(it.c));

const islandMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true, roughness: 0.95, metalness: 0 });

/* =====================================================================
   Island shape
   ===================================================================== */
function outlineR(a) { return 9.2 + 0.85 * Math.sin(3 * a + 1.3) + 0.45 * Math.sin(5 * a + 0.4) + 0.25 * Math.sin(9 * a + 2.1); }
const polar = (a, r) => ({ x: Math.cos(a) * r, z: Math.sin(a) * r });
const W_ANGLE = 0.46;                                    // waterfall direction
const EDGE_R = outlineR(W_ANGLE);
const EDGE = polar(W_ANGLE, EDGE_R);
const POND = polar(W_ANGLE + 0.2, 3.7);
const COTTAGE = polar(PHI_C + 1.08, 3.7);
const MILL = polar(PHI_C + 2.85, 5.6);
const HILL2 = polar(PHI_C + 4.1, 4.8);
const BRIDGE = { x: lerp(POND.x, EDGE.x, 0.5), z: lerp(POND.z, EDGE.z, 0.5) };

function rawH(x, z) {
  let y = 0.28 * Math.sin(x * 0.42 + 1.0) * Math.cos(z * 0.36 - 0.5) + 0.14 * Math.sin(x * 0.9 + z * 0.7 + 2.0) + 0.08 * Math.sin(z * 1.7 - x * 0.4);
  y += 1.55 * Math.exp(-((x - MILL.x) ** 2 + (z - MILL.z) ** 2) / 7.5);
  y += 0.75 * Math.exp(-((x - HILL2.x) ** 2 + (z - HILL2.z) ** 2) / 6);
  return y;
}
const COTTAGE_Y = rawH(COTTAGE.x, COTTAGE.z);
function terrainH(x, z) {
  let y = rawH(x, z);
  const dc = Math.hypot(x - COTTAGE.x, z - COTTAGE.z);
  y = lerp(y, COTTAGE_Y, 1 - smoothstep(2.7, 3.9, dc));
  const ds = distToSeg(x, z, POND.x, POND.z, EDGE.x * 1.06, EDGE.z * 1.06);
  y = lerp(y, 0.13, 1 - smoothstep(1.2, 2.6, ds));
  y = lerp(y, -0.16, 1 - smoothstep(0.35, 0.85, ds));
  const dp = Math.hypot(x - POND.x, z - POND.z);
  y = lerp(y, 0.13, 1 - smoothstep(2.3, 3.4, dp));
  y = lerp(y, -0.42, 1 - smoothstep(1.15, 2.05, dp));
  return y;
}
function waterMask(x, z) {
  const ds = distToSeg(x, z, POND.x, POND.z, EDGE.x, EDGE.z);
  const dp = Math.hypot(x - POND.x, z - POND.z);
  return Math.max(1 - smoothstep(0.9, 1.4, ds), 1 - smoothstep(2.1, 2.7, dp));
}

class GeoBuilder {
  constructor() { this.p = []; this.c = []; this.ab = V3(); this.ac = V3(); this.n = V3(); }
  tri(a, b, c, col, want) {
    if (want) { this.ab.subVectors(b, a); this.ac.subVectors(c, a); this.n.crossVectors(this.ab, this.ac); if (this.n.dot(want) < 0) { const t = b; b = c; c = t; } }
    this.p.push(a.x, a.y, a.z, b.x, b.y, b.z, c.x, c.y, c.z);
    for (let i = 0; i < 3; i++) this.c.push(col.r, col.g, col.b);
  }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.c, 3));
    g.computeVertexNormals(); return g;
  }

const vary = (col, amt = 0.06) => col.clone().multiplyScalar(1 + (rand() - 0.5) * 2 * amt);
const UP = V3(0, 1, 0), DOWN = V3(0, -1, 0);

/* ---- groups: islandRoot holds everything that floats; layers for the exploded view ---- */
const islandRoot = new THREE.Group(); scene.add(islandRoot);
const layerG = { village: new THREE.Group(), meadow: new THREE.Group(), soil: new THREE.Group(), strata: new THREE.Group(), deep: new THREE.Group(), core: new THREE.Group() };

/* ---- meadow: terrain top surface ---- */
const M_TOP = 84, N_RINGS = 14;
let topGeo, topBase, topSnow, outerRing;
(function buildTop() {
  const rings = [];
  for (let k = 1; k <= N_RINGS; k++) {
    const t = k / N_RINGS, off = (k % 2) * 0.5, ring = [];
    for (let j = 0; j < M_TOP; j++) {
      const a = (j + off + (k < N_RINGS ? (rand() - 0.5) * 0.4 : 0)) / M_TOP * TAU;
      const rf = k < N_RINGS ? t + (rand() - 0.5) * 0.4 / N_RINGS : 1;
      const r = rf * outlineR(a);
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      let y = terrainH(x, z); if (k === N_RINGS) y -= 0.1;
      ring.push(V3(x, y, z));
    }
    rings.push(ring);
  }
  outerRing = rings[N_RINGS - 1];
  const b = new GeoBuilder();
  const greens = [C('#79c44f'), C('#6cb948'), C('#86cc56'), C('#63ad44')];
  const sand = C('#e3cf96'), wetSand = C('#c9b27a'), hillTop = C('#a3d660'), edgeG = C('#5ea343');
  const snowBase = C('#eef4fa');
  const base = [], snow = [];
  const faceColor = (a, bb, c) => {
    const cx = (a.x + bb.x + c.x) / 3, cy = (a.y + bb.y + c.y) / 3, cz = (a.z + bb.z + c.z) / 3;
    let col = pick(greens).clone();
    col.lerp(hillTop, smoothstep(0.4, 1.4, cy) * 0.7);
    const rEdge = Math.hypot(cx, cz) / outlineR(Math.atan2(cz, cx));
    col.lerp(edgeG, smoothstep(0.82, 1.0, rEdge) * 0.6);
    const wm = waterMask(cx, cz);
    if (wm > 0.3) col = (wm > 0.75 ? wetSand : sand).clone();
    col = vary(col, 0.05);
    const s = snowBase.clone().multiplyScalar(0.92 + rand() * 0.08);
    if (wm > 0.75) s.lerp(C('#cfe0ea'), 0.5);
    return [col, s];
  };
  const push = (a, bb, c) => { const [col, s] = faceColor(a, bb, c); b.tri(a, bb, c, col, UP); base.push(col); snow.push(s); };
  const center = V3(0, terrainH(0, 0), 0);
  const r0 = rings[0];
  for (let j = 0; j < M_TOP; j++) push(center, r0[j], r0[(j + 1) % M_TOP]);
  for (let k = 0; k < N_RINGS - 1; k++) {
    const A = rings[k], B = rings[k + 1];
    for (let j = 0; j < M_TOP; j++) {
      const j2 = (j + 1) % M_TOP;
      push(A[j], B[j], B[j2]);
      push(A[j], B[j2], A[j2]);
    }
  }
  topGeo = b.build();
  topBase = base; topSnow = snow;
  const m = mesh(topGeo, topMat, false, true);
  layerG.meadow.add(m);
})();

function applySnowToTop(s) {
  const col = topGeo.attributes.color;
  for (let f = 0; f < topBase.length; f++) {
    _c.copy(topBase[f]).lerp(topSnow[f], s);
    for (let v = 0; v < 3; v++) col.setXYZ(f * 3 + v, _c.r, _c.g, _c.b);
  }
  col.needsUpdate = true;
}

/* ---- generic ring/band layer builder ---- */
const centerAt = y => ({ x: -y * 0.06, z: y * 0.035 });
function makeRing(y, scale, M, { jit = 0.04, yJit = 0, angJit = 0.3, off = 0 } = {}) {
  const c = centerAt(y), pts = [];
  for (let j = 0; j < M; j++) {
    const a = (j + off + (rand() - 0.5) * angJit) / M * TAU;
    const r = outlineR(a) * scale * (1 + (rand() - 0.5) * 2 * jit);
    pts.push(V3(c.x + Math.cos(a) * r, y + (rand() - 0.5) * 2 * yJit, c.z + Math.sin(a) * r));
  }
  return { pts, y, cx: c.x, cz: c.z };
}
function buildLayer(rings, colors, { topCap = true, bottomCap = true, capCol } = {}) {
  const b = new GeoBuilder(), out = V3();
  for (let i = 0; i < rings.length - 1; i++) {
    const A = rings[i].pts, B = rings[i + 1].pts, M = A.length, col = C(colors[i % colors.length]);
    for (let j = 0; j < M; j++) {
      const j2 = (j + 1) % M, a = A[j], bb = A[j2], c = B[j2], d = B[j];
      out.set((a.x + bb.x + c.x + d.x) / 4 - rings[i].cx, 0, (a.z + bb.z + c.z + d.z) / 4 - rings[i].cz).normalize();
      b.tri(a, bb, c, vary(col), out); b.tri(a, c, d, vary(col), out);
    }
  }
  const cap = (ring, want, col) => {
    const ctr = V3(ring.cx, ring.y, ring.cz), P = ring.pts;
    for (let j = 0; j < P.length; j++) b.tri(ctr, P[j], P[(j + 1) % P.length], vary(col, 0.03), want);
  };
  const cc = C(capCol || colors[0]);
  if (topCap) cap(rings[0], UP, cc);
  if (bottomCap) cap(rings[rings.length - 1], DOWN, C(colors[(rings.length - 2) % colors.length]).multiplyScalar(0.8));
  return mesh(b.build(), islandMat, true, true);
}

/* ---- meadow skirt: grass lip then dirt ---- */
(function buildSkirt() {
  const ringFrom = (y, s, jit) => {
    const pts = outerRing.map(p => { const a = Math.atan2(p.z, p.x); const r = Math.hypot(p.x, p.z) * s * (1 + (rand() - .5) * jit); return V3(Math.cos(a) * r, y, Math.sin(a) * r); });
    return { pts, y, cx: 0, cz: 0 };
  };
  const top = { pts: outerRing, y: 0, cx: 0, cz: 0 };
  const m = buildLayer([top, ringFrom(-0.32, 1.012, 0.01), ringFrom(-0.62, 0.995, 0.01)], ['#57a03f', '#86593a'], { topCap: false, bottomCap: true });
  layerG.meadow.add(m);
})();

/* ---- rock layers ---- */
const LAYER_DEF = {
  soil: { rings: [[-0.62, .995, 0, .015], [-1.2, .955, .1, .03], [-1.95, .865, 0, .03]], M: 52, colors: ['#8b5e3c', '#74492f'] },
  strata: { rings: [[-1.95, .865, 0, .04], [-2.55, .8, .1, .05], [-3.15, .735, .12, .05], [-3.85, .655, .12, .05], [-4.55, .57, 0, .05]], M: 38, colors: ['#cfac7f', '#b48e65', '#dcc193', '#a57e59'] },
  deep: { rings: [[-4.55, .57, 0, .06], [-5.65, .465, .2, .09], [-6.65, .36, .2, .1], [-7.55, .27, 0, .08]], M: 28, colors: ['#8a8090', '#786f82', '#6a6276'] },
  core: { rings: [[-7.55, .27, 0, .08], [-8.75, .17, .15, .12], [-9.95, .085, .1, .14], [-10.95, .018, 0, .1]], M: 16, colors: ['#655c70', '#5a5265', '#4f485a'] },
};
const layerRings = {};
for (const [key, def] of Object.entries(LAYER_DEF)) {

  layerRings[key] = rings;
  layerG[key].add(buildLayer(rings, def.colors));
}

/* ---- hanging rock spikes ---- */
function addSpike(layerKey, ringIdx, a, len, rad, color) {
  const def = LAYER_DEF[layerKey], [y, s] = def.rings[ringIdx], c = centerAt(y);
  const r = outlineR(a) * s * 0.86;
  const g = jitterGeo(new THREE.ConeGeometry(rad, len, 5, 2), rad * 0.35, rand() * 10);
  g.rotateX(Math.PI);
  const m = mesh(g, mat(color));
  m.position.set(c.x + Math.cos(a) * r, y - len / 2 + 0.25, c.z + Math.sin(a) * r);
  m.rotation.y = rand() * TAU;
  wetMats.push(m.material);
  layerG[layerKey].add(m);
}
for (let i = 0; i < 9; i++) { const a = rand() * TAU; if (Math.abs(((a - W_ANGLE + Math.PI) % TAU) - Math.PI) < 0.5) continue; addSpike('strata', 4, a, rr(1.4, 2.6), rr(0.35, 0.6), '#a07a57'); }
for (let i = 0; i < 8; i++) addSpike('deep', 3, rand() * TAU, rr(1.2, 2.4), rr(0.3, 0.5), '#5d5567');
for (let i = 0; i < 5; i++) addSpike('core', 1, rand() * TAU, rr(1.0, 1.8), rr(0.22, 0.36), '#4a4354');

/* ---- crystals ---- */
const crystalGeo = new THREE.OctahedronGeometry(0.32, 0);
for (let i = 0; i < 7; i++) {
  const a = rand() * TAU, ringI = 1 + Math.floor(rand() * 2), [y, s] = LAYER_DEF.deep.rings[ringI], c = centerAt(y);
  const r = outlineR(a) * s * 0.97;
  const dir = V3(Math.cos(a), -0.55, Math.sin(a)).normalize();
  const n = 2 + Math.floor(rand() * 2);
  for (let k = 0; k < n; k++) {
    const m = mesh(crystalGeo, crystalMat, false, false);
    const d2 = dir.clone().add(V3(rr(-.3, .3), rr(-.2, .2), rr(-.3, .3))).normalize();
    m.quaternion.setFromUnitVectors(UP, d2);
    m.scale.set(rr(.7, 1.1), rr(1.8, 3.0), rr(.7, 1.1));
    m.position.set(c.x + Math.cos(a) * r, y + rr(-.3, .3), c.z + Math.sin(a) * r).addScaledVector(d2, 0.25);

}
const keystone = (() => {

  const k = mesh(new THREE.OctahedronGeometry(0.85, 0), keystoneMat, false, false); k.scale.set(1, 1.9, 1); g.add(k);
  for (let i = 0; i < 3; i++) { const s = mesh(new THREE.OctahedronGeometry(0.22, 0), keystoneMat, false, false); s.userData.a = i / 3 * TAU; s.scale.set(1, 1.7, 1); g.add(s); }

/* ---- roots (tapered tubes) and vines ---- */
const roots = [];
function taperedTube(points, radius, segs = 18, radial = 5, taper = 0.85) {
  const curve = new THREE.CatmullRomCurve3(points);
  const g = new THREE.TubeGeometry(curve, segs, radius, radial, false);

    curve.getPointAt(i / segs, P);
    const k = 1 - taper * (i / segs);
    for (let j = 0; j <= radial; j++) {
      const idx = i * (radial + 1) + j;
      p.setXYZ(idx, P.x + (p.getX(idx) - P.x) * k, P.y + (p.getY(idx) - P.y) * k, P.z + (p.getZ(idx) - P.z) * k);
    }
  }
  g.computeVertexNormals();
  return g;
}
const rootMat = mat('#5b3b26'); wetMats.push(rootMat);
for (let i = 0; i < 30; i++) {
  const a = (i / 30) * TAU + rr(-0.08, 0.08);

const waterU = (mode, speed, scaleY, opacity) => ({
  uTime: { value: 0 }, uOpacity: { value: opacity }, uMode: { value: mode }, uSpeed: { value: speed }, uScaleY: { value: scaleY },
  uDeep: { value: C('#3a9bd3') }, uFoam: { value: C('#effbff') }, uLight: { value: C('#ffffff') }, uFade: { value: 1 },
});
const waterVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`;
const waterFS = `
  uniform float uTime,uOpacity,uMode,uSpeed,uScaleY,uFade; uniform vec3 uDeep,uFoam,uLight; varying vec2 vUv;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
  void main(){
    vec2 uv = vUv; float flow = uv.y*uScaleY - uTime*uSpeed;
    float n = noise(vec2(uv.x*7.0, flow*1.3))*0.6 + noise(vec2(uv.x*19.0 + 3.1, flow*3.2))*0.4;
    float streak = smoothstep(0.52, 0.86, n);
    float edge = smoothstep(0.0, 0.2, uv.x) * smoothstep(1.0, 0.8, uv.x);
    vec3 col = mix(uDeep, uFoam, streak*0.75 + (1.0-edge)*0.35);
    float a = mix(0.62, 1.0, streak);
    if (uMode > 0.5) {
      col = mix(col, uFoam, smoothstep(0.0, 0.08, uv.y)*0.25 + smoothstep(0.35, 0.95, uv.y)*0.8);
      float dissolve = smoothstep(0.98, 0.45, uv.y);
      float breakup = smoothstep(0.0, 0.35, n + dissolve - 0.55);
      a *= edge * dissolve * breakup;
    } else {
      a = mix(0.82, 1.0, streak) * smoothstep(0.0, 0.12, uv.x) * smoothstep(1.0, 0.88, uv.x);
    }

}

    pos.push(p.x, p.y, p.z); uv.push(v, i / (n - 1));
  }
  for (let i = 0; i < n - 1; i++) for (let k = 0; k < X; k++) {
    const a = i * (X + 1) + k, b = a + 1, c = a + X + 1, d = c + 1; idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();

}

}

function updateIsland(t, dt) {
  islandRoot.position.y = Math.sin(t * 0.45) * 0.18;
  islandRoot.rotation.z = Math.sin(t * 0.3) * 0.006;
  rotor.rotation.z -= dt * (0.9 + S.wind * 0.7);
  // trees
  const gust = 1 + 0.45 * Math.sin(t * 0.37) + 0.25 * Math.sin(t * 1.1);
  for (const tr of trees) {
    let extra = 0;
    if (tr.grow) {
      const p = clamp((t - tr.grow.t0) / tr.grow.dur, 0, 1);
      tr.g.scale.setScalar(Math.max(0.001, tr.s * easeOutBack(p)));
      extra = (1 - p) * 0.25;
      if (p >= 1) tr.grow = null;
    }
    const amp = 0.022 * S.wind * gust;
    tr.sway.rotation.z = Math.sin(t * 1.35 + tr.ph) * amp + Math.sin(t * 9 + tr.ph) * extra * 0.3 + amp * 0.5;
    tr.sway.rotation.x = Math.cos(t * 1.05 + tr.ph * 1.3) * amp * 0.6;
  }
  for (const r of roots) { r.rotation.z = Math.sin(t * 0.8 + r.userData.ph) * r.userData.amp * S.wind; r.rotation.x = Math.cos(t * 0.6 + r.userData.ph) * r.userData.amp * 0.6 * S.wind; }
  // pond ripples
  const pp = pond.geometry.attributes.position, base = pond.userData.base, amp = 0.025 + S.wet * 0.03;
  for (let i = 0; i < pp.count; i++) {
    const x = base[i * 3], z = base[i * 3 + 2], edge = 1 - smoothstep(1.4, 2.15, Math.hypot(x, z));
    pp.setY(i, (Math.sin(x * 2.2 + t * 1.6) + Math.sin(z * 2.7 - t * 1.3)) * amp * edge * (1 - S.snow * 0.8));
  }
  pp.needsUpdate = true;
  // keystone
  keystone.rotation.y += dt * 0.5;
  keystone.position.y = -12.4 + Math.sin(t * 1.2) * 0.15;
  keystone.children.forEach((c, i) => { if (i === 0 || !c.userData.a && c.userData.a !== 0) return; const a = c.userData.a + t * 0.9; c.position.set(Math.cos(a) * 1.5, Math.sin(t * 1.5 + i) * 0.3, Math.sin(a) * 1.5); });
  // smoke
  for (const m of smoke) {
    const u = m.userData; u.life += dt;
    if (u.life > u.max) { u.life -= u.max; m.userData.spin.set(rand(), rand(), rand()); }
    const p = u.life / u.max;
    m.position.set(smokeOrigin.x + p * 1.4 * S.wind + Math.sin(p * 5 + u.spin.x * 6) * 0.15, smokeOrigin.y + p * 3.2, smokeOrigin.z + p * 0.7 * S.wind + Math.cos(p * 4 + u.spin.y * 6) * 0.15);
    m.scale.setScalar(0.45 + p * 1.5);
    m.rotation.set(u.spin.x * 6 + p, u.spin.y * 6 + p * 0.7, u.spin.z);
    m.material.opacity = smoothstep(0, 0.12, p) * (1 - smoothstep(0.45, 1, p)) * 0.72;
    m.material.color.copy(COL.white).multiplyScalar(lerp(0.92, 0.55, S.night));
  }
  // mist + spray
  for (let i = 0; i < mist.n; i++) {
    const st = mistState[i]; st.life += dt;
    if (st.life > st.max) spawnMist(i);
    const p = st.life / st.max;
    mist.pos[i * 3] += st.v.x * dt; mist.pos[i * 3 + 1] += st.v.y * dt; mist.pos[i * 3 + 2] += st.v.z * dt;
    mist.size[i] = st.s0 * (0.6 + p * 0.9);
    mist.alpha[i] = smoothstep(0, 0.25, p) * (1 - smoothstep(0.55, 1, p));
  }
  mist.update();
  for (let i = 0; i < spray.n; i++) {
    const st = sprayState[i]; st.life += dt;
    if (st.life > st.max) spawnSpray(i);
    st.v.y -= 6 * dt;
    spray.pos[i * 3] += st.v.x * dt; spray.pos[i * 3 + 1] += st.v.y * dt; spray.pos[i * 3 + 2] += st.v.z * dt;
    const p = st.life / st.max; spray.size[i] = 0.12 + p * 0.12; spray.alpha[i] = (1 - p) * 0.9;
  }
  spray.update();
  // fireflies
  const ffVis = smoothstep(0.45, 1, S.night) * (1 - S.wRain * 0.85) * (1 - S.wSnow * 0.6);
  fireflies.p.visible = ffVis > 0.01;
  if (fireflies.p.visible) {
    for (let i = 0; i < fireflies.n; i++) {
      const b = ffBase[i];
      fireflies.pos[i * 3] = b.x + Math.sin(t * 0.5 * b.f + b.ph) * 0.8 + Math.sin(t * 1.3 * b.f + b.ph * 2) * 0.2;
      fireflies.pos[i * 3 + 1] = b.y + Math.sin(t * 0.7 * b.f + b.ph * 3) * 0.4;
      fireflies.pos[i * 3 + 2] = b.z + Math.cos(t * 0.45 * b.f + b.ph) * 0.8;
      fireflies.alpha[i] = ffVis * Math.pow(0.5 + 0.5 * Math.sin(t * b.b + b.ph), 3);
    }
    fireflies.update();
  }
  // sparkles
  for (let i = 0; i < sparkles.n; i++) {
    const st = spState[i]; if (st.life >= st.max) { sparkles.alpha[i] = 0; continue; }
    st.life += dt; st.v.multiplyScalar(1 - dt * 1.5);
    sparkles.pos[i * 3] += st.v.x * dt; sparkles.pos[i * 3 + 1] += st.v.y * dt; sparkles.pos[i * 3 + 2] += st.v.z * dt;
    const p = st.life / st.max; sparkles.alpha[i] = (1 - p) * (0.6 + 0.4 * Math.sin(st.life * 30));
  }
  sparkles.update();
}

function updateSky(t, dt) {
  // clouds drift
  const camP = camera.position, camD = camP.distanceTo(controls.target);
  const f0 = Math.max(5, camD * 0.35), f1 = Math.max(14, camD * 0.62);
  for (const c of clouds) {
    c.position.x += c.userData.speed * dt * (0.6 + S.wind * 0.5);
    if (c.position.x > 120) c.position.x = -120;
    const d = c.position.distanceTo(camP);
    c.scale.setScalar(c.userData.s * smoothstep(f0, f1, d));
    c.visible = d > 4.5;
  }
  // islets bob
  for (const g of islets) { g.position.y = g.userData.y + Math.sin(t * 0.5 + g.userData.ph) * 0.4; g.rotation.y += g.userData.rs * dt; }
  // birds
  const away = S.night * 75 + S.wRain * 45 + S.wSnow * 10;
  for (const b of birds) {
    const a = b.ph + t * b.speed, R = b.Rad + away, sgn = Math.sign(b.speed);
    _bp.set(Math.cos(a) * R, b.h + Math.sin(t * 0.6 + b.ph * 3) * 0.8 + away * 0.15, Math.sin(a) * R);
    _bn.set(Math.cos(a + sgn * 0.03) * R, _bp.y, Math.sin(a + sgn * 0.03) * R);
    b.g.position.copy(_bp); b.g.lookAt(_bn); b.g.rotateZ(sgn * 0.28);
    const glide = 0.35 + 0.65 * Math.max(0, Math.sin(t * 0.55 + b.fph));
    const f = Math.sin(t * b.flap + b.fph) * 0.75 * glide + 0.1;
    b.L.rotation.z = f; b.R.rotation.z = -f;
    b.g.visible = R < 110;
  }
  // rain
  const rainOn = S.wRain > 0.01; rain.visible = rainOn;
  if (rainOn) {
    rainMat.opacity = S.wRain * lerp(0.55, 0.35, S.night);
    const wx = 3.5;
    for (let i = 0; i < RAIN_N; i++) {
      rainY[i] -= rainV[i] * dt; rainX[i] += wx * dt;
      if (rainY[i] < -RAIN_TOP || shelteredByIsland(rainX[i], rainY[i], rainZ[i]) || rainX[i] > RAIN_BOX) {
        rainY[i] = RAIN_TOP + rand() * 6; rainX[i] = rr(-RAIN_BOX - 6, RAIN_BOX); rainZ[i] = rr(-RAIN_BOX, RAIN_BOX);
      }
      const o = i * 6, len = 0.95;
      rainPos[o] = rainX[i]; rainPos[o + 1] = rainY[i]; rainPos[o + 2] = rainZ[i];
      rainPos[o + 3] = rainX[i] - wx * len / rainV[i]; rainPos[o + 4] = rainY[i] + len; rainPos[o + 5] = rainZ[i];
    }
    rainGeo.attributes.position.needsUpdate = true;
  }
  // snow
  const snowOn = S.wSnow > 0.01; snow.p.visible = snowOn;
  if (snowOn) {
    snow.m.uniforms.uOpacity.value = S.wSnow * lerp(0.95, 0.7, S.night);
    for (let i = 0; i < snow.n; i++) {
      const o = i * 3;
      snow.pos[o + 1] -= snowV[i] * dt;
      snow.pos[o] += (Math.sin(t * 0.8 + snowPh[i]) * 0.5 + 0.6) * dt;
      snow.pos[o + 2] += Math.cos(t * 0.6 + snowPh[i] * 1.3) * 0.4 * dt;
      if (snow.pos[o + 1] < -RAIN_TOP || snow.pos[o] > RAIN_BOX || shelteredByIsland(snow.pos[o], snow.pos[o + 1], snow.pos[o + 2])) {
        snow.pos[o] = rr(-RAIN_BOX - 4, RAIN_BOX); snow.pos[o + 1] = RAIN_TOP + rand() * 4; snow.pos[o + 2] = rr(-RAIN_BOX, RAIN_BOX);
      }
      snow.alpha[i] = 1;
    }
    snow.update();
  }
}

function updateExplode(t) {
  const e = explodeTw.update(t, x => x);
  S.explode = e;
  LAYERS.forEach((L, i) => {
    const p = easeInOut(clamp((e - i * 0.055) / 0.725, 0, 1));
    L.p = p;
    const g = layerG[L.key];
    g.position.y = L.off * p;
    g.rotation.y = p * 0.09 * (i - 2.5);
  });
  S.fallVis = 1 - smoothstep(0.0, 0.22, e);
  waterfall.visible = S.fallVis > 0.001;
  mist.p.visible = spray.p.visible = waterfall.visible;
}

const _off = V3();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  now = clock.elapsedTime; const t = now;
  S.night = nightTw.update(t);
  [S.wClear, S.wRain, S.wSnow] = wTw.map(tw => tw.update(t));
  const sum = S.wClear + S.wRain + S.wSnow || 1; S.wClear /= sum; S.wRain /= sum; S.wSnow /= sum;
  S.snow += (S.wSnow - S.snow) * Math.min(1, dt * (S.wSnow > S.snow ? 0.3 : 0.45));
  S.wet += (S.wRain - S.wet) * Math.min(1, dt * 0.5);
  S.wind = 1 + S.wRain * 1.3 + S.wSnow * 0.45;

  updateExplode(t);
  updateEnvironment(t, dt);
  updateIsland(t, dt);
  updateSky(t, dt);

  // camera distance tween (intro swoop + explode framing)
  if (camTw.active) {
    camTw.update(t);
    _off.subVectors(camera.position, controls.target).setLength(camTw.v);
    camera.position.copy(controls.target).add(_off);
  }
  const ty = lerp(-3.4, -4.6, S.explode);
  camera.position.y += ty - controls.target.y; controls.target.y = ty;
  const idle = !dragging && (t - lastInteract) > 3.5;
  controls.autoRotateSpeed = lerp(controls.autoRotateSpeed, idle ? 0.5 : 0, Math.min(1, dt * 1.2));
  controls.update(dt);
  sky.position.copy(camera.position); stars.position.copy(camera.position);
  updateLabels();
  renderer.render(scene, camera);
  sound.update(S);
}

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(innerWidth, innerHeight);
  updatePointScale();
  controls.maxDistance = Math.max(70, fitDist(33, 14) * 1.5);
}
addEventListener('resize', () => { onResize(); LAYERS.forEach(L => L.cw = 0); });
document.addEventListener('visibilitychange', () => { if (!sound.ctx) return; document.hidden ? sound.ctx.suspend() : (sound.on && sound.ctx.resume()); });

renderUI();
_off.subVectors(camera.position, controls.target).setLength(camTw.v); camera.position.copy(controls.target).add(_off);
renderer.setAnimationLoop(frame);
requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => document.body.classList.add('ready'), 250)));
window.__island = { S, trigger, renderer, scene, camera };
</script>
</body>
